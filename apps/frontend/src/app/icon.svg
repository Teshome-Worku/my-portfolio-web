<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="iconEmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#BB4D00"/>
    </linearGradient>
    <radialGradient id="dotHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7A00" stop-opacity="1"/>
      <stop offset="60%" stop-color="#FF7A00" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF7A00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Obsidian Tile Base -->
  <rect width="128" height="128" rx="28" fill="url(#iconBg)" stroke="#262626" stroke-width="2.5"/>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#BB4D00" stroke-width="1.2" stroke-opacity="0.3"/>

  <!-- Terminal Cursor Spine (Pure White) -->
  <rect x="30" y="28" width="9" height="72" rx="4.5" fill="#FFFFFF"/>

  <!-- Upper Angled Code Beam (Ember Orange) -->
  <path d="M48 64 L84 32" stroke="url(#iconEmber)" stroke-width="9.5" stroke-linecap="round"/>

  <!-- Lower Angled Code Beam (Ember Orange) -->
  <path d="M48 64 L84 96" stroke="url(#iconEmber)" stroke-width="9.5" stroke-linecap="round"/>

  <!-- Right .Dev Chevron Closure (Crisp White Accent) -->
  <path d="M84 46 L98 64 L84 82" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Glowing Aura for Dot -->
  <circle cx="104" cy="64" r="10" fill="url(#dotHalo)"/>

  <!-- The .Dev Pulse Dot Core -->
  <circle cx="104" cy="64" r="5.5" fill="#FF7A00"/>
</svg>